name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck

  # E2E backend: справжній Postgres, запущений API, HTTP-запити ззовні
  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/depara_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/depara_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      AUTH_MODE: fake
      ADMIN_EMAILS: e2e.admin@lnu.edu.ua
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed -- --shift-to-current-week
      - run: npm run test:e2e

  # Прод-образ: збирається, застосовує міграції на старті і відповідає на /health.
  # Контейнер запускається як на хостингу: NODE_ENV=production, без фейкового входу.
  backend-docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depara_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Зібрати образ
        run: docker build -t depara-backend backend
      - name: Без JWT_SECRET контейнер не має стартувати
        run: |
          if docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/depara_docker \
            -e DIRECT_URL=postgresql://postgres:postgres@localhost:5432/depara_docker \
            -e REDIS_URL=redis://localhost:6379 \
            depara-backend; then
            echo "Контейнер стартував без JWT_SECRET"; exit 1
          fi
      - name: Запустити і перевірити /health
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/depara_docker \
            -e DIRECT_URL=postgresql://postgres:postgres@localhost:5432/depara_docker \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci-only-secret \
            depara-backend
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs api; exit 1; fi
      - name: Демо-консоль у проді недоступна
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dev)
          test "$code" = "404"
      - name: Логи контейнера
        if: always()
        run: docker logs api || true

  # Конфігурація VPS-деплою (deploy/): синтаксис compose і скриптів. Саме розгортання тут не перевіряється.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скрипти деплою (shellcheck)
        run: shellcheck -x deploy/*.sh
      - name: Прод-compose валідний
        run: |
          printf '%s\n' DOMAIN=api.example.com POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci JWT_SECRET=ci > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f deploy/docker-compose.prod.yml config --quiet
      - name: Postgres і Redis не публікують порти на хост
        run: |
          printf '%s\n' DOMAIN=api.example.com POSTGRES_PASSWORD=ci REDIS_PASSWORD=ci JWT_SECRET=ci > /tmp/ci.env
          out=$(docker compose --env-file /tmp/ci.env -f deploy/docker-compose.prod.yml config --format json)
          for s in postgres redis api; do
            n=$(echo "$out" | jq ".services.$s.ports // [] | length")
            test "$n" = 0 || { echo "$s публікує порти на хост"; exit 1; }
          done
