name: app-screenshots

# Знімки екранів зі справжнього release APK на Android-емуляторі: для демо й документації. Нічого не перевіряє й
# не є обовʼязковою перевіркою. Бекенд піднімається тут же з демо-даними, вхід за паролем (бази одноразові).
# Запуск: push змін сценарію в робочу гілку або вручну (Actions -> app-screenshots -> Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [dev/conlusive]
    paths:
      - .github/workflows/app-screenshots.yml
      - mobile/e2e/screens/**

concurrency:
  group: app-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/depara_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/depara_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
      PUSH_ENABLED: 'false'
      # Пароль демо-акаунтів в одноразовій базі цього запуску, не секрет
      DEMO_PASSWORD: example-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Backend з демо-даними
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run seed:demo
          for user in demo.student demo.headman demo.newcomer; do
            printf '%s' "$DEMO_PASSWORD" | npx tsx src/cli/setPassword.ts "$user@lnu.edu.ua"
          done
          nohup npm run start > api.log 2>&1 &
          npx --yes wait-on http://localhost:3000/health

      - name: Збірка release APK
        working-directory: mobile
        env:
          API_URL: http://10.0.2.2:3000
          ALLOW_HTTP: '1'
          NODE_ENV: production
        run: |
          npm ci --include=dev
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease

      - name: Увімкнути KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Знімки на емуляторі
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ github.workspace }}/mobile/android/app/build/outputs/apk/release/app-release.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobile
          # demo mode: охайний рядок стану (сталий час, повна батарея, без чужих значків)
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            npm i -g appium
            appium driver install uiautomator2
            npx wdio run e2e/wdio.conf.ts --spec e2e/screens/app-screens.e2e.ts

      - name: Викласти знімки, APK і лог API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            mobile/e2e/artifacts/
            mobile/android/app/build/outputs/apk/release/app-release.apk
            backend/api.log
          if-no-files-found: warn
          retention-days: 14
